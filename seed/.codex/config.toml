# Repo-scoped Codex config. Inert until the project is marked trusted in Codex.
# No sandbox_mode key: that legacy key disables named permission profiles.
# default_permissions must stay above the first [table]: after one it binds to that table and the profile never loads.
approval_policy = "never"
default_permissions = "loam"

[features]
hooks = false
multi_agent = true

[agents]
max_concurrent_threads_per_session = 6

[permissions.loam]
description = "Workspace editing with network on and .env denied."
extends = ":workspace"

[permissions.loam.network]
# No domains table: domain rules only bind when features.network_proxy runs the proxy.
enabled = true

[permissions.loam.filesystem]
# Linux and WSL cannot expand an unbounded ** deny glob; without this cap codex doctor warns per pattern (0.153.4).
glob_scan_max_depth = 3

[permissions.loam.filesystem.":workspace_roots"]
".env*" = "deny"
"**/.env*" = "deny"
