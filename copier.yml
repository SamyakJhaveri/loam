_min_copier_version: "9.16.0"
_subdirectory: "seed"
_templates_suffix: .jinja
# Render checked-in symlinks (e.g. .claude/skills/catchup -> ../../.agents/skills/catchup)
# as symlinks instead of dereferencing them.
_preserve_symlinks: true
_envops:
  keep_trailing_newline: true

# With _subdirectory: "seed", only seed/ contents are rendered.
# These exclusions cover generic noise inside seed/.
_exclude:
  - ".DS_Store"
  - "*.pyc"
  - "__pycache__"
  - "*.bak"
  - ".git"
  - ".claude/audit.log"
  - ".claude/skill-usage.log"
  # Loam-repo maintenance config (numeric-claim checker); never ships.
  - ".claude/stale-counts.json"
  # Loam's own verification skill (renders Loam and drives sessions in the render); never ships.
  - ".claude/skills/verify-loam"
  - ".claude/.local-paths"
  - ".claude/settings.local.json"
  - ".claude/worktrees"
  # Codex review transcripts written through the root .claude symlink; never ship.
  - ".claude/codex-reviews"
  # The memory system, for a project that answers memory=false. Task 1 strips its hook entries
  # from settings.json; the .jinja docs drop its prose.
  - "{% if not memory %}.claude/hooks/mem-capture.sh{% endif %}"
  - "{% if not memory %}.claude/hooks/mem-recall.sh{% endif %}"
  - "{% if not memory %}.codex/hooks.json{% endif %}"
  - "{% if not memory %}bin/memsearch{% endif %}"
  - "{% if not memory %}bin/mem-inspect{% endif %}"
  - "{% if not memory %}bin/mem-weekly.sh{% endif %}"
  - "{% if not memory %}THIRD_PARTY_NOTICES{% endif %}"

# Questions asked during `copier copy`
project_name:
  type: str
  help: "What is your project name?"
  validator: "{% if not project_name %}Project name is required{% endif %}"

github_repo:
  type: str
  help: "GitHub repo (owner/repo) for this project? Leave empty to skip. Trailing .git is stripped automatically."
  default: ""
  validator: "{% if github_repo and not (github_repo | regex_search('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')) %}Invalid repo format - use owner/repo{% endif %}"

project_kind:
  type: str
  help: "Project kind? Gates pyproject.toml and the pyright-lsp plugin (python, research, mixed get both)."
  choices: [python, typescript, research, mixed, other]
  default: python

memory:
  type: bool
  help: "Ship the session-memory system (capture and recall hooks, memsearch, mem-inspect, mem-weekly)? Answer no for a project that runs no hooks."
  default: true

# Post-generation tasks (run in the generated project directory)
_tasks:
  # Strip from settings what the answers turn off: the pyright-lsp plugin for non-Python project
  # kinds; when memory is off, the memory hook entries and Codex's features.hooks, which only the
  # memory hooks need. Runs on update too: the update's temp renders must match the stripped
  # files, or the merge re-adds them as a conflict.
  # bin/sync-project repeats these strips and the kind list; change both together.
  - >-
    {% if project_kind not in ['python', 'research', 'mixed'] or not memory %}
    python3 -c "import json; f='.claude/settings.json'; d=json.load(open(f)); {% if project_kind not in ['python', 'research', 'mixed'] %}d.get('enabledPlugins', {}).pop('pyright-lsp@claude-plugins-official', None); {% endif %}{% if not memory %}d.update(hooks={e: k for e, k in ((e, [g for g in v if not any('/mem-' in h['command'] for h in g['hooks'])]) for e, v in d['hooks'].items()) if k}) if 'hooks' in d else None; c='.codex/config.toml'; t=open(c).read(); open(c, 'w').write(t.replace('\nhooks = true\n', '\nhooks = false\n')); {% endif %}w=open(f, 'w'); json.dump(d, w, indent=2); w.write('\n')"
    {% else %}
    true
    {% endif %}

  # Initialize git repo on copy only: `copier update` also runs every task in two temp renders
  # that have no .git, where this would commit and task 3 would push and post a ruleset.
  # _gh_setup.sh is left untracked: task 4 deletes it, and a tracked-then-deleted file makes the
  # rendered bin/check fail on its first run (bash -n over git ls-files finds no such file).
  - >-
    {% if _copier_operation == 'copy' %}
    if [ ! -d .git ]; then (git init -b main 2>/dev/null || git init) && git add . && git reset -q -- _gh_setup.sh && git commit -m 'Initial commit from loam'; fi
    {% else %}
    true
    {% endif %}

  # Optional: create or connect GitHub repo, on copy only (see task 2)
  - >-
    {% if github_repo and _copier_operation == 'copy' %}
    if ! git remote get-url origin >/dev/null 2>&1; then
      bash _gh_setup.sh "{{ github_repo }}"
    else
      echo '[copier] Remote origin already configured - skipping GitHub setup.'
    fi
    {% else %}
    true
    {% endif %}

  # Clean up helper scripts. Runs on update too, where the render writes _gh_setup.sh again.
  - "rm -f _gh_setup.sh"
