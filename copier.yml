_min_copier_version: "9.6.0"
_subdirectory: "seed"
_templates_suffix: .jinja
# Render checked-in symlinks (e.g. .claude/skills/catchup -> ../../.agents/skills/catchup)
# as symlinks instead of dereferencing them.
_preserve_symlinks: true
_envops:
  keep_trailing_newline: true

# With _subdirectory: "seed", only seed/ contents are rendered.
# These exclusions cover generic noise inside seed/.
_exclude:
  - ".DS_Store"
  - "*.pyc"
  - "__pycache__"
  - "*.bak"
  - ".git"
  - ".claude/audit.log"
  - ".claude/skill-usage.log"
  # Loam-repo maintenance config (numeric-claim checker); never ships.
  - ".claude/stale-counts.json"
  # Loam's own verification skill (renders Loam and drives sessions in the render); never ships.
  - ".claude/skills/verify-loam"
  - ".claude/.local-paths"
  - ".claude/settings.local.json"
  - ".claude/worktrees"
  # Codex review transcripts written through the root .claude symlink; never ship.
  - ".claude/codex-reviews"
  # Factory development dependencies and local state never ship.
  - ".loam/runtime/node_modules"
  - ".loam/runtime/.cache"
  - ".loam/runtime/.state"
  - ".loam/runtime/runtime-installation"

# Questions asked during `copier copy`
project_name:
  type: str
  help: "What is your project name?"
  validator: "{% if not project_name %}Project name is required{% endif %}"

github_repo:
  type: str
  help: "GitHub repo (owner/repo) for this project? Leave empty to skip. Trailing .git is stripped automatically."
  default: ""
  validator: "{% if github_repo and not (github_repo | regex_search('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')) %}Invalid repo format — use owner/repo{% endif %}"

project_kind:
  type: str
  help: "Project kind? Gates pyproject.toml and the pyright-lsp plugin (python, research, mixed get both)."
  choices: [python, typescript, research, mixed, other]
  default: python

# Post-generation tasks (run in the generated project directory)
_tasks:
  # Strip the pyright-lsp plugin from settings for non-Python project kinds. Runs on update too:
  # the update's temp renders must match the stripped file, or the merge re-adds the plugin as a conflict.
  - >-
    {% if project_kind not in ['python', 'research', 'mixed'] %}
    python3 -c "import json; f='.claude/settings.json'; d=json.load(open(f)); d.get('enabledPlugins', {}).pop('pyright-lsp@claude-plugins-official', None); w=open(f, 'w'); json.dump(d, w, indent=2); w.write('\n')"
    {% else %}
    true
    {% endif %}

  # Initialize git repo on copy only: `copier update` also runs every task in two temp renders
  # that have no .git, where this would commit and task 3 would push and post a ruleset.
  # _gh_setup.sh is left untracked: task 4 deletes it, and a tracked-then-deleted file makes the
  # rendered bin/check fail on its first run (bash -n over git ls-files finds no such file).
  - >-
    {% if _copier_operation == 'copy' %}
    if [ ! -d .git ]; then (git init -b main 2>/dev/null || git init) && git add . && git reset -q -- _gh_setup.sh && git commit -m 'Initial commit from loam'; fi
    {% else %}
    true
    {% endif %}

  # Optional: create or connect GitHub repo, on copy only (see task 2)
  - >-
    {% if github_repo and _copier_operation == 'copy' %}
    if ! git remote get-url origin >/dev/null 2>&1; then
      bash _gh_setup.sh "{{ github_repo }}"
    else
      echo '[copier] Remote origin already configured — skipping GitHub setup.'
    fi
    {% else %}
    true
    {% endif %}

  # Clean up helper scripts. Runs on update too, where the render writes _gh_setup.sh again.
  - "rm -f _gh_setup.sh"
