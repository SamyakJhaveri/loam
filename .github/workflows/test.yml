name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job ids `verify` and `stub-sweep` are the status checks main's ruleset requires, and bin/release.sh refuses to release without them. Keep the ids.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/ci/python-requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r .github/ci/python-requirements.txt

      - name: Select factory qualification Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('.github/ci/npm-packages.txt') }}

      - name: Install agent CLIs
        run: xargs npm install -g < .github/ci/npm-packages.txt

      - name: Configure Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@loam"

      - name: Declare factory qualification tools
        run: |
          echo "LOAM_FACTORY_TOOLCHAIN=$(node -p 'require("node:path").dirname(require("node:path").dirname(process.execPath))')" >> "$GITHUB_ENV"
          echo "LOAM_FACTORY_COPIER=$(command -v copier)" >> "$GITHUB_ENV"

      - name: Run check
        run: bin/check
        # The runner's /tmp is a tmpfs with a user quota; the runtime admission qualification copies the
        # node toolchain into a temp tree per case and hits that quota (EDQUOT, 2026-10-21). The runner's
        # temp directory is on the root disk.
        env:
          TMPDIR: ${{ runner.temp }}

  # verify-loam's $0 stub recipes in a fresh render: hooks fire, memory is recalled, a deny rule refuses, the rendered check passes.
  stub-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/ci/python-requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r .github/ci/python-requirements.txt

      - name: Select Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('.github/ci/npm-packages.txt') }}

      - name: Install agent CLIs
        run: xargs npm install -g < .github/ci/npm-packages.txt

      - name: Configure Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@loam"

      - name: Run verify-loam stub sweep
        run: .claude/skills/verify-loam/control-loam sweep

  # The factory tests on macOS, where ps and date differ (#448). Not a required check.
  factory-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/ci/python-requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r .github/ci/python-requirements.txt

      - name: Configure Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@loam"

      - name: Run factory tests
        run: python3 -m pytest -rs -n auto bin/tests/test_factory*.py
