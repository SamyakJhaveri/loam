name: Test
# CI smoke test 2026-09-01: first live run of the agent-CLI + ruff install steps.

on:
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/ci/python-requirements.txt

      - name: Install Python dependencies
        run: python3 -m pip install -r .github/ci/python-requirements.txt

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('.github/ci/npm-packages.txt') }}

      - name: Install agent CLIs
        run: xargs npm install -g < .github/ci/npm-packages.txt

      - name: Configure Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@loam"

      - name: Verify template
        run: bin/verify-template.sh
